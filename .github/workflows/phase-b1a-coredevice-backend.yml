name: Phase B1a - CoreDevice backend

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IDEVICE_REF: ebd7dadfc55d1c4facee3d11ecf5b28e20548b57
  JKTCP_REF: e674e1eee6d5943e13b1eba0bd24a9dd0b2fa020

jobs:
  coredevice-backend:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout migration repository
        uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false

      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.2"

      - name: Checkout pinned idevice
        uses: actions/checkout@v4
        with:
          repository: SideStore/idevice
          ref: ${{ env.IDEVICE_REF }}
          path: idevice
          fetch-depth: 1
          submodules: recursive

      - name: Checkout pinned jktcp
        uses: actions/checkout@v4
        with:
          repository: SideStore/jktcp
          ref: ${{ env.JKTCP_REF }}
          path: jktcp
          fetch-depth: 1

      - name: Verify source revisions
        shell: bash
        run: |
          set -euo pipefail

          test "$(git -C idevice rev-parse HEAD)" = "$IDEVICE_REF"
          test "$(git -C jktcp rev-parse HEAD)" = "$JKTCP_REF"

          echo "idevice=$(git -C idevice rev-parse HEAD)"
          echo "jktcp=$(git -C jktcp rev-parse HEAD)"
          xcodebuild -version
          rustc --version
          cargo --version

      - name: Install Rust build requirements
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v bindgen >/dev/null 2>&1; then
            cargo install --locked bindgen-cli --version 0.72.1
          fi

          rustup target add aarch64-apple-ios

      - name: Apply CoreDevice transport patches
        shell: bash
        run: |
          set -euo pipefail

          python3 builder/scripts/patch_jktcp_reliability.py jktcp
          python3 builder/scripts/patch_coredevice_idevice.py idevice jktcp

          ! grep -R -E 'rppairing_connect_quic|create_quic_listener|quinn::' \
            idevice/ffi/src/tunnel_provider.rs \
            idevice/idevice/src/tunnel.rs

          grep -Fq \
            'packet.extend_from_slice(CDTUNNEL_MAGIC)' \
            idevice/idevice/src/tunnel.rs

          grep -Fq \
            'effective_mss = negotiated_mtu.saturating_sub(60).min(1340)' \
            idevice/ffi/src/tunnel_provider.rs

          grep -Fq \
            'HeartbeatClient::connect' \
            idevice/ffi/src/tunnel_provider.rs

          grep -Fq \
            'run_sync_local(async move { fd.write_entire(data_slice).await })' \
            idevice/ffi/src/afc.rs

          grep -Fq \
            'let data = unsafe { Box::from_raw(slice) };' \
            idevice/ffi/src/lib.rs

      - name: Test patched transport sources
        shell: bash
        run: |
          set -euo pipefail

          cargo fmt --manifest-path jktcp/Cargo.toml
          cargo fmt --manifest-path idevice/ffi/Cargo.toml

          git -C jktcp diff --check
          git -C idevice diff --check

          cargo test \
            --manifest-path jktcp/Cargo.toml \
            --lib -- \
            --skip tests::local_tcp \
            --skip tests::handle_speed

          cargo check \
            --manifest-path idevice/ffi/Cargo.toml \
            --features obfuscate

      - name: Build idevice for iOS
        working-directory: idevice
        shell: bash
        run: |
          set -euo pipefail

          BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path)" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            cargo build \
              --release \
              --target aarch64-apple-ios \
              --features obfuscate \
              --manifest-path ffi/Cargo.toml

          test -f target/aarch64-apple-ios/release/libidevice_ffi.a
          test -f ffi/idevice.h

          grep -Fq 'tunnel_create_usb' ffi/idevice.h
          grep -Fq 'tunnel_heartbeat_is_active' ffi/idevice.h
          grep -Fq 'idevice_set_transport_log_callback' ffi/idevice.h

          xcrun nm \
            -arch arm64 \
            -g target/aarch64-apple-ios/release/libidevice_ffi.a \
            >/tmp/current-idevice-symbols.txt \
            2>/tmp/current-nm-reader-warnings.txt || true

          grep -E \
            '[[:space:]][Tt][[:space:]]_lockdown_diag_rust_log$' \
            /tmp/current-idevice-symbols.txt

          grep -E \
            '[[:space:]][Tt][[:space:]]_idevice_set_transport_log_callback$' \
            /tmp/current-idevice-symbols.txt

          rm -rf swift/IDevice.xcframework
          cp ffi/idevice.h swift/include/idevice.h

          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libidevice_ffi.a \
            -headers swift/include \
            -output swift/IDevice.xcframework

          test -d swift/IDevice.xcframework

      - name: Verify XCFramework
        shell: bash
        run: |
          set -euo pipefail

          test -f idevice/swift/IDevice.xcframework/Info.plist

          find idevice/swift/IDevice.xcframework \
            -maxdepth 4 \
            -type f \
            -print

          plutil -p \
            idevice/swift/IDevice.xcframework/Info.plist

      - name: Record provenance
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/provenance

          git -C idevice rev-parse HEAD \
            > artifacts/provenance/idevice.sha

          git -C jktcp rev-parse HEAD \
            > artifacts/provenance/jktcp.sha

          xcodebuild -version \
            > artifacts/provenance/xcode.txt

          rustc --version \
            > artifacts/provenance/rust.txt

          cargo --version \
            >> artifacts/provenance/rust.txt

          cp /tmp/current-idevice-symbols.txt \
            artifacts/provenance/idevice-symbols.txt

          cp /tmp/current-nm-reader-warnings.txt \
            artifacts/provenance/nm-warnings.txt || true

          git -C idevice diff --binary \
            > artifacts/provenance/idevice.patch

          git -C jktcp diff --binary \
            > artifacts/provenance/jktcp.patch

          shasum -a 256 \
            idevice/target/aarch64-apple-ios/release/libidevice_ffi.a \
            > artifacts/provenance/sha256.txt

      - name: Stage XCFramework artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/output

          cp -R \
            idevice/swift/IDevice.xcframework \
            artifacts/output/IDevice.xcframework

      - name: Upload Phase B1a artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase-b1a-coredevice-backend
          path: artifacts
          if-no-files-found: error
          retention-days: 14
