name: Dispatch Release Build

on:
  push:
    branches:
      - 'release/**'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    # The v1.0.3 workflow owns its preflight, build and publication.
    # Freeze 3.0.2.1 using existing build 36748073104; documentation pushes must not rebuild.
    if: github.ref_name != 'release/v1.0.3' && github.ref_name != 'release/3.0.2.1'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current SideStore build for this release branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run build-current.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${RELEASE_REF}"
